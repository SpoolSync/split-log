<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://pixora-bca1f.firebaseapp.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9eeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e161a" media="(prefers-color-scheme: dark)">
<title>Split Log</title>
<style>
/* Same paper-and-ink family as Spend Log, with its own violet accent. One phone-width column. */
:root{
  --paper:#e9eeec; --tape:#fbfcfa; --ink:#14232a; --muted:#566669; --line:#c7d0ce;
  --accent:#5b36b8; --accent-ink:#ffffff;
  --owed:#1d7a6b; --owe:#c2412d;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e161a; --tape:#18242a; --ink:#e6ecea; --muted:#94a4a7; --line:#2d3d43;
    --accent:#b9a2ff; --accent-ink:#0e161a;
    --owed:#5cc5b1; --owe:#f28f7b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:700;line-height:1.05;overflow-wrap:anywhere}
h2{font-size:21px;font-weight:700;line-height:1.15}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.danger{border-color:var(--owe);color:var(--owe)}
.btn.mini{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:transparent;cursor:pointer;align-self:flex-start;min-height:32px;text-align:left}
.status.warn{color:var(--owe);border-color:var(--owe)}
.back{all:unset;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--muted);padding:6px 0;min-height:32px}

/* the headline position, printed like a till slip */
.tape{position:relative;background:var(--tape);padding:18px 16px 20px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:conic-gradient(from -45deg at 50% 100%,var(--tape) 90deg,transparent 0) 0 0/14px 7px repeat-x}
.total{font-size:38px;font-weight:600;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.rule{border:0;border-top:1px dashed var(--line);margin:0}
.ln{display:flex;align-items:baseline;gap:6px}
.ln .lead{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px);min-width:12px}
.ln .k{overflow-wrap:anywhere}
.pos{color:var(--owed)}
.neg{color:var(--owe)}
.payline{display:flex;align-items:center;gap:10px;justify-content:space-between;font-family:var(--body);font-size:15px}

.panel{background:var(--tape);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-top:14px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.row{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.rowmain{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;width:100%}
.rowmain:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.what{font-weight:600;overflow-wrap:anywhere}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.meta{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:3px 7px;background:transparent;color:var(--muted)}
.chip.has{color:var(--accent);border-color:var(--accent)}
.chip.warn{color:var(--owe);border-color:var(--owe);border-style:dashed}

/* forms */
dialog{border:0;border-radius:14px;padding:0;background:var(--tape);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,14,17,.6)}
.form{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;min-height:44px;font-size:16px}
textarea{min-height:150px;font-family:var(--mono);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 2px;cursor:pointer;font-weight:500;font-size:14px;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.prow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center}
.prow .nm{overflow-wrap:anywhere}
.prow input{text-align:right;font-family:var(--mono)}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.tog input{width:22px;height:22px;flex:none}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:36px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.itemtop{display:grid;grid-template-columns:1fr 100px 44px;gap:8px}
.itemtop input:nth-child(2){text-align:right;font-family:var(--mono)}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;min-height:44px;cursor:pointer}
.hint{font-size:13px;font-family:var(--mono);color:var(--muted)}
.hint.bad{color:var(--owe)}
.hint.ok{color:var(--owed)}
.err{color:var(--owe);font-size:14px;font-weight:600}
.preview{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);align-self:flex-start}
.mrow{display:grid;grid-template-columns:1fr auto 44px;gap:8px;align-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.lockcard{width:100%;max-width:400px;background:var(--tape);border:2px solid var(--ink);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.lockcard form{display:flex;flex-direction:column;gap:14px}
@media (max-width:400px){.two{grid-template-columns:1fr}.total{font-size:32px}.seg button{font-size:13px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="shared" hidden></main>

<section class="lock" id="lock" hidden>
  <div class="lockcard">
    <p class="eyebrow">Split Log</p>
    <h1 id="lockTitle">Split Log</h1>
    <p class="muted" id="lockSub"></p>
    <form id="lockForm" novalidate>
      <div class="field"><label for="l-pass">Passcode</label><input type="password" id="l-pass" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field" id="l-confirmField" hidden><label for="l-confirm">Repeat passcode</label><input type="password" id="l-confirm" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button type="submit" class="btn primary" id="l-go">Unlock</button>
    </form>
    <button type="button" class="btn quiet danger" id="l-erase" hidden>Forgot it? Erase everything and start over</button>
    <button type="button" class="btn quiet" id="l-acct" hidden>Sign in with a Pixora account instead</button>
  </div>
</section>
<section class="lock" id="acct" hidden>
  <div class="lockcard">
    <p class="eyebrow">Split Log · Pixora</p>
    <h1>Sign in</h1>
    <p class="muted">Use your Pixora account to share groups with friends and keep Split Log on all your phones. Everything is encrypted on your phone before it's uploaded, so nobody else can read it. Receipt photos stay on your phone.</p>
    <div id="acctBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</section>

<main class="wrap" id="app" hidden></main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<script src="pixora-summary.js"></script>
<script src="split-core.js"></script>
<script src="app.js"></script>
</body>
</html>
